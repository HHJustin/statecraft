[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "statecraft"
version = "0.1.0"
description = "多 Agent 治理内核 + 代码注释生成 / 代码审查两条流水线"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
statecraft = "statecraft.cli:main"

[tool.setuptools.packages.find]
include = ["statecraft*"]

# 这三行不是可选的：缺一个，装出来的包就少一批文件，而且不报错。
#   agents/*.md    —— core/runner.py 的三层 prompt 继承（GLOBAL.md -> {name}.md），
#                     文件缺失时 load_prompt() 静默降级成「你是 executor。」，
#                     多 agent 的行为质量整体塌陷，但测试全绿。
#   schema.sql     —— storage 建表脚本，缺了连库都建不出来。
#   golden/*.jsonl —— eval 黄金集，缺了 python -m statecraft.eval.runner 直接崩。
[tool.setuptools.package-data]
"statecraft" = ["agents/*.md"]
"statecraft.storage" = ["schema.sql"]
"statecraft.eval" = ["golden/*.jsonl"]
